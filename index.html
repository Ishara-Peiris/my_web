    <style>
        
/* Mobile Menu (Hidden by Default) */
.menu-toggle {
    display: none;
    font-size: 28px;

}

/* Responsive Styles */
@media (max-width: 768px) {
    .navbar {
        display: none; /* Hide menu */
        flex-direction: column;
        background: #fff;
        position: absolute;
        top: 60px;
        right: 20px;
        width: 200px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .navbar a {
        padding: 10px;
        display: block;
        text-align: center;
        border-bottom: 1px solid #ddd;
    }

    .menu-toggle {
        display: block; /* Show hamburger */
    }

    /* Show Menu When Active */
    .navbar.active {
        display: flex;
    }
}
